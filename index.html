<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>雨中词页</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Songti SC", "SimSun", serif;
    }

```
body {
    height: 100vh;
    overflow: hidden;
    background: #0a0a0a;
    color: #e8e6e3;
}

/* 🌧️ 雨背景 */
.rain {
    position: fixed;
    width: 100%;
    height: 100%;
    background: url('https://i.imgur.com/7b1XK5F.gif') repeat;
    opacity: 0.15;
    z-index: 1;
}

/* 🌫️ 暗层 */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.3), #000 90%);
    z-index: 2;
}

/* 📜 左侧诗词 */
.poem {
    position: relative;
    z-index: 3;
    width: 40%;
    padding: 80px 60px;
    line-height: 2;
    font-size: 20px;
    letter-spacing: 2px;
    white-space: pre-line;
}

/* 🌙 微光效果 */
.poem::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 2px;
    height: 100%;
    background: linear-gradient(to bottom, transparent, #aaa, transparent);
    opacity: 0.3;
}
```

</style>
</head>

<body>

<div class="rain"></div>
<div class="overlay"></div>

<div class="poem">
临江仙

曾共西窗听夜雨，
灯花落尽无声。
旧时眉月照孤城。

后来春色好，
不似那时明。

几度看花花不语，
几回临水波平。
人间何处遣深情。

半生都是梦，
一梦伴卿行。

</div>

</body>
</html>
