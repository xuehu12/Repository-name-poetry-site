<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>灯下词</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Songti SC", "SimSun", serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #050505;
    color: #eae7e2;
}

/* 🌧️ 雨（远） */
.rain-back {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        -20deg,
        rgba(255,255,255,0.12) 0px,
        rgba(255,255,255,0.12) 2px,
        transparent 2px,
        transparent 28px
    );
    animation: rainBack 0.7s linear infinite;
    opacity: 0.25;
    z-index: 1;
}

/* 🌧️ 雨（近） */
.rain-front {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        -20deg,
        rgba(255,255,255,0.25) 0px,
        rgba(255,255,255,0.25) 3px,
        transparent 3px,
        transparent 18px
    );
    animation: rainFront 0.35s linear infinite;
    opacity: 0.4;
    z-index: 2;
}

@keyframes rainBack {
    from { background-position: 0 0; }
    to { background-position: -20px 40px; }
}

@keyframes rainFront {
    from { background-position: 0 0; }
    to { background-position: -40px 60px; }
}

/* 🌫️ 呼吸感光影 */
.breath {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 70%);
    animation: breath 6s ease-in-out infinite;
    z-index: 3;
}

@keyframes breath {
    0%,100% { opacity: 0.2; }
    50% { opacity: 0.35; }
}

/* ⚡ 微弱闪光 */
.flash {
    position: fixed;
    width: 100%;
    height: 100%;
    background: #ffffff;
    opacity: 0;
    z-index: 4;
    animation: flash 12s infinite;
}

@keyframes flash {
    0%, 97%, 100% { opacity: 0; }
    98% { opacity: 0.08; }
    99% { opacity: 0.02; }
}

/* 📜 诗词（慢慢出现） */
.poem {
    position: relative;
    z-index: 5;
    width: 42%;
    padding: 90px 70px;
    line-height: 2.3;
    font-size: 21px;
    letter-spacing: 2px;
    white-space: pre-line;
    opacity: 0;
    animation: fadeIn 4s ease forwards;
    animation-delay: 1s;
}

/* ✨ 淡入 */
@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(10px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}
</style>

</head>

<body>

<div class="rain-back"></div>
<div class="rain-front"></div>
<div class="breath"></div>
<div class="flash"></div>

<div class="poem">
临江仙

曾共西窗听夜雨，
灯花落尽无声。
旧时眉月照孤城。

后来春色好，
不似那时明。

几度看花花不语，
几回临水波平。
人间何处遣深情。

半生都是梦，
一梦伴卿行。

</div>

</body>
</html>
