<!DOCTYPE html>

<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>雨中词页</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Songti SC", "SimSun", serif;
}

body {
    height: 100vh;
    overflow: hidden;
    background: #080808;
    color: #e8e6e3;
}

/* 🌧️ 第一层雨（远） */
.rain1 {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        -20deg,
        rgba(255,255,255,0.15) 0px,
        rgba(255,255,255,0.15) 2px,
        transparent 2px,
        transparent 25px
    );
    animation: rain1 0.6s linear infinite;
    z-index: 1;
    opacity: 0.3;
}

/* 🌧️ 第二层雨（近） */
.rain2 {
    position: fixed;
    width: 100%;
    height: 100%;
    background: repeating-linear-gradient(
        -20deg,
        rgba(255,255,255,0.25) 0px,
        rgba(255,255,255,0.25) 3px,
        transparent 3px,
        transparent 15px
    );
    animation: rain2 0.3s linear infinite;
    z-index: 2;
    opacity: 0.4;
}

@keyframes rain1 {
    from { background-position: 0 0; }
    to { background-position: -20px 40px; }
}

@keyframes rain2 {
    from { background-position: 0 0; }
    to { background-position: -40px 60px; }
}

/* 🌫️ 暗层 */
.overlay {
    position: fixed;
    width: 100%;
    height: 100%;
    background: radial-gradient(circle at center, rgba(0,0,0,0.2), #000 90%);
    z-index: 3;
}

/* 📜 诗词 */
.poem {
    position: relative;
    z-index: 4;
    width: 40%;
    padding: 80px 60px;
    line-height: 2.2;
    font-size: 20px;
    letter-spacing: 2px;
    white-space: pre-line;
}
</style>

</head>

<body>

<div class="rain1"></div>
<div class="rain2"></div>
<div class="overlay"></div>

<div class="poem">
临江仙

曾共西窗听夜雨，
灯花落尽无声。
旧时眉月照孤城。

后来春色好，
不似那时明。

几度看花花不语，
几回临水波平。
人间何处遣深情。

半生都是梦，
一梦伴卿行。

</div>

</body>
</html>
